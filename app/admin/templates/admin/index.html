{% extends "base.html" %}

{% block content %}
<!-- Приветствие -->
<div class="welcome-section">
    <h4 class="mb-3">Добро пожаловать в Лизинг CRM</h4>
</div>

<!-- Модули системы -->
<div class="row g-4">
        <!-- Модуль конфигурации -->
    <div class="col-md-6 col-lg-3">
        <div class="module-card">
            <div class="mb-3">
                <i class="fas fa-file-signature module-icon"></i>
            </div>
            <h5 class="mb-3">Конфигурация системы</h5>
            <a href="{{ url_for('admin.get_users') }}" class="btn btn-primary">
                <i class="fas fa-arrow-right me-1"></i> Перейти
            </a>
        </div>
    </div>
    <!-- Модуль пользователей -->
    <div class="col-md-6 col-lg-3">
        <div class="module-card">
            <div class="mb-3">
                <i class="fas fa-file-signature module-icon"></i>
            </div>
            <h5 class="mb-3">Пользователи</h5>
            <a href="{{ url_for('admin.get_users') }}" class="btn btn-primary">
                <i class="fas fa-arrow-right me-1"></i> Перейти
            </a>
        </div>
    </div>

    <!-- Модуль клиентов -->
    <div class="col-md-6 col-lg-3">
        <div class="module-card">
            <div class="mb-3">
                <i class="fas fa-user-tie module-icon"></i>
            </div>
            <h5 class="mb-3">Клиенты</h5>
            <a href="{{ url_for('admin.get_clients') }}" class="btn btn-primary">
                <i class="fas fa-arrow-right me-1"></i> Перейти
            </a>
        </div>
    </div>

    <!-- Модуль сделок -->
    <div class="col-md-6 col-lg-3">
        <div class="module-card">
            <div class="mb-3">
                <i class="fas fa-file-contract module-icon"></i>
            </div>
            <h5 class="mb-3">Все сделки</h5>
            <a href="{{ url_for('admin.get_deals') }}" class="btn btn-primary">
                <i class="fas fa-arrow-right me-1"></i> Перейти
            </a>
        </div>
    </div>
</div>
{% endblock %}
