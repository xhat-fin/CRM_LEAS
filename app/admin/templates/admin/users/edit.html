{% extends "base.html" %}

{% block title %}Редактирование пользователя {{ user.username }} | Лизинг CRM{% endblock %}

{% block content %}
<div class="card border-0 shadow-sm">
    <div class="card-header bg-white d-flex justify-content-between align-items-center border-bottom">
        <h5 class="mb-0 text-primary">
            <i class="fas fa-user-edit me-2"></i>Редактирование пользователя #{{ user.id }}
        </h5>
        <a href="{{ url_for('admin.get_users') }}" class="btn btn-sm btn-outline-secondary">
            <i class="fas fa-arrow-left me-1"></i> Назад
        </a>
    </div>
    
    <div class="card-body">
        <form method="POST" action="{{ url_for('admin.edit_user', id=user.id) }}">
            <div class="row g-3">
                <div class="col-md-6">
                    <div class="mb-3">
                        <label for="username" class="form-label">Логин</label>
                        <input type="text" class="form-control" id="username" name="username" 
                               value="{{ user.username }}" required>
                    </div>
                </div>
                
                <div class="col-md-6">
                    <div class="mb-3">
                        <label for="full_name" class="form-label">Полное имя</label>
                        <input type="text" class="form-control" id="full_name" name="full_name" 
                               value="{{ user.full_name }}" required>
                    </div>
                </div>
                
                <div class="col-md-6">
                    <div class="mb-3">
                        <label for="role_id" class="form-label">Роль</label>
                        <select class="form-select" id="role_id" name="role_id" required>
                            <option value="">Выберите роль</option>
                            {% for role in roles %}
                            <option value="{{ role.id }}" {% if role.id == user.role_id %}selected{% endif %}>
                                {{ role.name }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                
                <div class="col-12">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save me-1"></i> Сохранить
                    </button>
                    <a href="{{ url_for('admin.get_user', id=user.id) }}" class="btn btn-outline-secondary ms-2">
                        Отмена
                    </a>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
